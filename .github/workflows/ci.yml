name: EduProject CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eduproject_ci
          POSTGRES_USER: eduproject_ci
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduproject_ci -d eduproject_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_ENV: test
      PUBLIC_ORIGIN: https://testserver
      COOKIE_SECURE: "true"
      DATABASE_URL: postgresql+psycopg://eduproject_ci:ci_test_only@127.0.0.1:5432/eduproject_ci
      TEST_DATABASE_URL: postgresql+psycopg://eduproject_ci:ci_test_only@127.0.0.1:5432/eduproject_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-lock-dev.txt
            scripts/requirements-checks.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-lock-dev.txt -r scripts/requirements-checks.txt
      - name: Validate infrastructure and environment initializer
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/check_structure.py
          python scripts/init_env.py
          docker compose config --quiet
      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run backend tests including PostgreSQL concurrency
        working-directory: backend
        run: |
          mkdir -p ../qa/ci
          python -m pytest -q --junitxml=../qa/ci/backend.xml
          python -c "import xml.etree.ElementTree as E; assert all(int(s.get('skipped', 0)) == 0 for s in E.parse('../qa/ci/backend.xml').getroot().iter('testsuite')), 'CI must exercise all PostgreSQL tests'"
      - name: Check frontend JavaScript and tests
        shell: bash
        run: |
          node --check frontend/assets/app.js
          node --check frontend/assets/api.js
          node --test --test-reporter=tap frontend/tests/*.test.js | tee qa/ci/frontend.tap
          python -m unittest discover -s frontend/tests -p http_contract.py -v 2>&1 | tee qa/ci/frontend-http.log
      - name: Build runtime image
        run: docker build --tag eduproject:ci .
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eduproject-ci-checks
          path: qa/ci/
          if-no-files-found: ignore
