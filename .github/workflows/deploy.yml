name: EduProject manual deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eduproject-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, eduproject-deploy]
    environment: eduproject-staging
    timeout-minutes: 15
    steps:
      - name: Require the repository default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Deploy only from the protected default branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy using the runner's preconfigured environment
        # Runner must provide EDUPROJECT_ENV_FILE and EDUPROJECT_PUBLIC_URL.
        # This does not create a runner, DNS, HTTPS or Telegram credentials.
        run: python3 scripts/deploy.py
